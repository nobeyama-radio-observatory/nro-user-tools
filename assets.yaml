- id: tool-casa-export
  name: CASA の形式への書き出しとパイプライン処理
  kind: ソフトウェア
  depends_on: [db-radio-archive]
  status: 運用中
  introduced: 観測後のデータを CASA（アルマの解析システム）の入力の形式で書き出す機能が稼働している。アーカイブと連携し、CASA のパイプライン処理を使える。2021年度にパイプライン処理のデータの公開を始めた
  maintenance: {by: 未記入, condition: 未記入, effort: 未記入}
  renewal: 解析の主力は今後 CASA に移る（40周年記念誌 p.60）
  owner_role: 未定
  maintainers: 未記入
  sources:
    - 40周年記念誌 p.57、p.60
  note: CASA そのものはアルマの解析システムで、観測所の資産ではない。依存先の db-radio-archive が記念誌のデータアーカイブと同じものかは未確認
