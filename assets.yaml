  renewal: CASA に移していく予定だが、あまり進んでいない。ソフトウェアはどれも古くなっており、AI を使って使い勝手のよいものに更新したい（聞き取り2026-11-18 問7）
  owner_role: 計算機グループ
  maintainers: 0
  sources:
    - 40周年記念誌 p.60
    - 保守、担い手の数、更新の見込み：聞き取り2026-11-18 問6、問7
    - 担当：聞き取り2026-11-18 問1

