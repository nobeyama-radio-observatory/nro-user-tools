# 資産の台帳：利用者向けのツール
# 項目の定義はハブの assets/README.md を参照。
#   https://github.com/nobeyama-radio-observatory/nro-context/blob/main/assets/README.md
# 2026-11-18 に新しく作った（判断記録 0006）。40周年記念誌から AI が埋め、聞き取り（interviews/）で補った。
#
# 接続先、ネットワーク構成、アクセスの方式、ソフトウェアの構成部品と版など、制御と情報セキュリティの詳細は書かない。
# この台帳にない id の置き場所は、ハブの assets/README.md の資産の索引で引ける。
#
# 出典の略記
#   40周年記念誌：『野辺山宇宙電波観測所40周年記念誌』2022年2月（国立国会図書館 請求記号 MB12-M7）。p.N はそのページ。
#     書誌の詳細はハブの history/README.md の出典の略記。年次報告と食い違うときは年次報告を採る
#   聞き取りYYYY-MM-DD(-n) 問N：interviews/YYYY-MM-DD(-n).md の問N
#   聞き取り2026-11-18 問N：nro-data の interviews/2026-11-18.md の問N（データの保管と続けて聞いたため、記録は nro-data にだけ置く）
#     https://github.com/nobeyama-radio-observatory/nro-data/blob/main/interviews/2026-11-18.md

- id: tool-obs-script
  name: 観測指示書の作成ソフト（nobs）
  kind: ソフトウェア
  status: 運用中
  introduced: 2010年ごろから（仮説）
  maintenance: {by: なし, condition: すでに維持できておらず、保守の手間はかかっていない。担い手がいなくなった。7BEE や eQ などの新しい受信機に対応できていない, effort: 未記入}
  renewal: 新しい受信機に対応する改修が必要。GUI を web UI にしたい。ソフトウェアはどれも古くなっており、AI を使って使い勝手のよいものに更新したい（聞き取り2026-11-18 問7）
  owner_role: 計算機グループ
  maintainers: 0
  sources:
    - 名称：所内の相談（2026-11-18）、聞き取り2026-11-18 問5
    - 導入、保守、担い手の数、更新の見込み：聞き取り2026-11-18 問5
    - 担当：聞き取り2026-11-18 問1
  note: 指示書は、アンテナのスキャンやデータの取得のタイミングなどを示した一連の命令で、COSMOS のマネージャーが読み込んで各装置に送る（40周年記念誌 p.56）

